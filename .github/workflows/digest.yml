name: digest

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 늦거나 통째로 빠지기도 한다. 그래서 같은 회차를 여러 번 예약해 두고,
    # 이미 보낸 회차는 건너뛴다 (아래 Decide slot).
    - cron: "7 23 * * *"   # 08:07 KST (아침)
    - cron: "37 23 * * *"
    - cron: "7 0 * * *"
    - cron: "37 0 * * *"
    - cron: "7 10 * * *"   # 19:07 KST (저녁)
    - cron: "37 10 * * *"
    - cron: "7 11 * * *"
    - cron: "37 11 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "어느 회차로 실행할지"
        type: choice
        required: true
        options:
          - morning
          - evening

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 대기열에서 기다리다 시작한 실행이 이전 실행의 푸시를 놓치지 않게 최신으로 맞춘다
      - name: Fast-forward to latest
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            # 한국 시각이 15시 전이면 아침, 아니면 저녁 회차로 본다 (실행이 늦어져도 같은 회차)
            HOUR=$(TZ=Asia/Seoul date +%H)
            if [ "$((10#$HOUR))" -lt 15 ]; then SLOT=morning; else SLOT=evening; fi
            TODAY=$(TZ=Asia/Seoul date +%F)
            if [ "$((10#$HOUR))" -lt 5 ]; then
              # 새벽에 뒤늦게 시작된 예약 실행은 보내지 않는다 (다음 아침 회차를 막지 않도록)
              echo "too late for the previous slot; skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            elif [ -f ".sent/$TODAY-$SLOT" ]; then
              echo "already sent: $TODAY $SLOT"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          else
            SLOT="$INPUT_SLOT"
          fi
          echo "value=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Build page
        if: steps.slot.outputs.skip != 'true'
        env:
          PYTHONPATH: src
          SLOT: ${{ steps.slot.outputs.value }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: python -m newsbot.main --slot "$SLOT" --phase build

      # 페이지가 올라간 뒤에 카톡을 보내야 링크가 바로 열린다
      - name: Publish pages
        if: steps.slot.outputs.skip != 'true'
        env:
          SLOT: ${{ steps.slot.outputs.value }}
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no page changes"
          else
            git commit -m "chore: update digest ($SLOT)"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Wait for the page to be reachable
        if: steps.slot.outputs.skip != 'true'
        run: |
          PAGE_URL=$(python -c "import json; print(json.load(open('.digest_message', encoding='utf-8'))['link'])")
          curl -fsS --retry 12 --retry-delay 15 --retry-all-errors -o /dev/null "$PAGE_URL" \
            || echo "page not reachable yet; sending the message anyway"

      - name: Send KakaoTalk message
        if: steps.slot.outputs.skip != 'true'
        env:
          PYTHONPATH: src
          SLOT: ${{ steps.slot.outputs.value }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python -m newsbot.main --slot "$SLOT" --phase send

      # 카톡 전송이 성공한 회차만 기록한다 (전송이 실패하면 다음 예약이 다시 시도한다)
      - name: Mark slot as sent
        if: steps.slot.outputs.skip != 'true'
        env:
          SLOT: ${{ steps.slot.outputs.value }}
        run: |
          mkdir -p .sent
          touch ".sent/$(TZ=Asia/Seoul date +%F)-$SLOT"
          git add .sent
          git commit -m "chore: mark $SLOT sent"
          git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Persist rotated Kakao refresh token
        if: always() && steps.slot.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f .new_refresh_token ]; then
            gh secret set KAKAO_REFRESH_TOKEN --repo "$REPO" < .new_refresh_token
            rm -f .new_refresh_token
          fi
