name: digest

on:
  schedule:
    # GitHub 예약 실행은 몇 시간씩 늦거나 통째로 빠지기도 한다. 그래서 같은 회차를 여러 번 예약해 두고,
    # 이미 보낸 회차는 건너뛴다 (scripts/decide_slot.sh). 주 트리거는 cron-job.org의 workflow_dispatch.
    - cron: "7 23 * * *"   # 08:07 KST (아침)
    - cron: "37 23 * * *"
    - cron: "7 0 * * *"
    - cron: "37 0 * * *"
    - cron: "7 10 * * *"   # 19:07 KST (저녁)
    - cron: "37 10 * * *"
    - cron: "7 11 * * *"
    - cron: "37 11 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "어느 회차로 실행할지"
        type: choice
        required: true
        options:
          - morning
          - evening
      force:
        description: "이미 보낸 회차여도 다시 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: digest-${{ github.event.inputs.slot || (contains(fromJSON('["7 23 * * *","37 23 * * *","7 0 * * *","37 0 * * *"]'), github.event.schedule) && 'morning' || 'evening') }}
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 대기열에서 기다리다 시작한 실행이 이전 실행의 푸시를 놓치지 않게 최신으로 맞춘다
      - name: Fast-forward to latest
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide slot
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
          FORCE: ${{ github.event.inputs.force }}
          SCHEDULE: ${{ github.event.schedule }}
        run: bash scripts/decide_slot.sh >> "$GITHUB_OUTPUT"

      - name: Build page
        if: steps.slot.outputs.skip != 'true'
        env:
          PYTHONPATH: src
          SLOT: ${{ steps.slot.outputs.value }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: python -m newsbot.main --slot "$SLOT" --phase build

      # 페이지가 올라간 뒤에 카톡을 보내야 링크가 바로 열린다
      - name: Publish pages
        if: steps.slot.outputs.skip != 'true'
        env:
          SLOT: ${{ steps.slot.outputs.value }}
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no page changes"
          else
            git commit -m "chore: update digest ($SLOT)"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Wait for the page to be reachable
        if: steps.slot.outputs.skip != 'true'
        run: |
          PAGE_URL=$(python -c "import json; print(json.load(open('.digest_message', encoding='utf-8'))['link'])")
          curl -fsS --retry 6 --retry-delay 10 --retry-all-errors -o /dev/null "$PAGE_URL" \
            || echo "page not reachable yet; sending the message anyway"

      - name: Send KakaoTalk message
        if: steps.slot.outputs.skip != 'true'
        env:
          PYTHONPATH: src
          SLOT: ${{ steps.slot.outputs.value }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python -m newsbot.main --slot "$SLOT" --phase send

      # 카톡 전송이 성공한 회차만 기록한다 (전송이 실패하면 다음 예약이 다시 시도한다)
      - name: Mark slot as sent
        if: steps.slot.outputs.skip != 'true'
        env:
          SLOT: ${{ steps.slot.outputs.value }}
          SLOT_DATE: ${{ steps.slot.outputs.date }}
        run: |
          mkdir -p .sent
          touch ".sent/$SLOT_DATE-$SLOT"
          git add .sent
          git diff --cached --quiet && exit 0
          git commit -m "chore: mark $SLOT sent"
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((i * 3))
          done
          echo "could not push the sent marker" >&2
          exit 1

      - name: Persist rotated Kakao refresh token
        if: always() && steps.slot.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          if [ -f .new_refresh_token ]; then
            gh secret set KAKAO_REFRESH_TOKEN --repo "$REPO" < .new_refresh_token
            rm -f .new_refresh_token
          fi
