name: digest

on:
  schedule:
    - cron: "0 23 * * *"   # 08:00 KST (아침)
    - cron: "0 10 * * *"   # 19:00 KST (저녁)
  workflow_dispatch:
    inputs:
      slot:
        description: "morning 또는 evening"
        default: "morning"

permissions:
  contents: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ github.event.schedule }}" = "0 23 * * *" ]; then echo "value=morning" >> "$GITHUB_OUTPUT"; else echo "value=evening" >> "$GITHUB_OUTPUT"; fi
          else
            echo "value=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run digest
        id: run
        env:
          PYTHONPATH: src
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_ACCESS_TOKEN: ${{ secrets.KAKAO_ACCESS_TOKEN }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
        run: python -m newsbot.main --slot "${{ steps.slot.outputs.value }}"

      - name: Persist rotated Kakao refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f .new_refresh_token ]; then
            gh secret set KAKAO_REFRESH_TOKEN --repo "${{ github.repository }}" < .new_refresh_token
            rm -f .new_refresh_token
          fi

      - name: Publish pages
        if: always()
        run: |
          git config user.name "newsbot"
          git config user.email "newsbot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no page changes"
          else
            git commit -m "chore: update digest (${{ steps.slot.outputs.value }})"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
